<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Days ☀️</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFB830;
    --sky: #4FC3F7;
    --green: #66BB6A;
    --pink: #F48FB1;
    --purple: #CE93D8;
    --coral: #FF8A65;
    --bg: #FFF8EE;
    --text: #3D2C2C;
    --soft: #7B6B6B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, var(--sun) 0%, var(--coral) 60%, var(--pink) 100%);
    padding: 24px 20px 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "☀️";
    position: absolute;
    font-size: 120px;
    opacity: 0.12;
    top: -20px; right: -20px;
    animation: spin 20s linear infinite;
  }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    color: white;
    text-shadow: 2px 3px 0px rgba(0,0,0,0.12);
  }
  header p { color: rgba(255,255,255,0.9); font-size: 1rem; font-weight: 700; margin-top: 4px; }
  .date-bar {
    background: white; text-align: center; padding: 10px;
    font-weight: 800; font-size: 1rem; color: var(--coral);
    border-bottom: 2px dashed var(--sun);
  }

  /* Tabs */
  .tabs {
    display: flex; overflow-x: auto; padding: 16px 12px 0; gap: 8px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 10px 18px; border-radius: 999px;
    font-family: 'Fredoka One', cursive; font-size: 1rem; cursor: pointer;
    border: 3px solid transparent; transition: all 0.2s;
    background: white; color: var(--soft);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .tab.active { color: white; box-shadow: 0 4px 14px rgba(0,0,0,0.15); transform: translateY(-2px); }
  .tab[data-kid="0"].active { background: var(--sky); border-color: #29B6F6; }
  .tab[data-kid="1"].active { background: var(--green); border-color: #43A047; }
  .tab[data-kid="2"].active { background: var(--pink); border-color: #E91E8C; }
  .tab[data-kid="3"].active { background: var(--purple); border-color: #AB47BC; }
  .tab[data-kid="4"].active { background: var(--coral); border-color: #F4511E; }
  .tab[data-kid="mom"].active { background: #37474F; border-color: #263238; }

  .content { padding: 16px 14px; max-width: 600px; margin: 0 auto; }

  .card {
    background: white; border-radius: 20px; padding: 18px 20px;
    margin-bottom: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    position: relative; overflow: hidden;
  }
  .card-label {
    font-family: 'Fredoka One', cursive; font-size: 1.1rem;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }

  /* Bible verse */
  .verse-card { background: linear-gradient(135deg, #E8F5E9, #F1F8E9); border-left: 5px solid var(--green); }
  .verse-text { font-size: 1rem; font-style: italic; color: #2E7D32; font-weight: 700; line-height: 1.5; }
  .verse-ref { font-size: 0.85rem; color: #558B2F; margin-top: 6px; font-weight: 800; }

  /* Activity */
  .activity-card { background: linear-gradient(135deg, #E3F2FD, #EDE7F6); border-left: 5px solid var(--sky); }
  .activity-box {
    background: white; border-radius: 12px; padding: 14px;
    text-align: center; font-family: 'Fredoka One', cursive;
    font-size: 1.4rem; color: var(--sky);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
  }

  /* Musts */
  .must-card { background: linear-gradient(135deg, #FFF3E0, #FBE9E7); border-left: 5px solid var(--sun); }
  .must-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px dashed #F0D9C8; cursor: pointer;
  }
  .must-item:last-child { border-bottom: none; }
  .checkbox {
    width: 26px; height: 26px; border-radius: 8px;
    border: 2.5px solid var(--sun); display: flex;
    align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; font-size: 16px;
  }
  .must-item.done .checkbox { background: var(--green); border-color: var(--green); color: white; }
  .must-item.done .must-label { text-decoration: line-through; color: #aaa; }
  .must-label { font-weight: 700; font-size: 0.95rem; }

  /* Chore */
  .chore-card { border-left: 5px solid var(--coral); }
  .chore-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px dashed #F0E0D8; cursor: pointer;
  }
  .chore-item:last-child { border-bottom: none; }
  .chore-item.done .chore-label { text-decoration: line-through; color: #aaa; }
  .chore-label { font-weight: 700; font-size: 0.95rem; }

  /* Progress */
  .progress-bar-bg {
    height: 12px; background: #F0E0D8; border-radius: 999px;
    overflow: hidden; margin-top: 8px;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--sun), var(--coral));
    border-radius: 999px; transition: width 0.4s ease;
  }
  .progress-text { font-size: 0.8rem; font-weight: 800; color: var(--soft); margin-top: 4px; text-align: right; }

  @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  /* Per-kid accent colors */
  body.kid-0 .chore-item .checkbox { border-color: var(--sky); }
  body.kid-0 .chore-item.done .checkbox { background: var(--sky); border-color: var(--sky); color:white; }
  body.kid-0 .progress-bar-fill { background: linear-gradient(90deg, var(--sky), #29B6F6); }
  body.kid-1 .chore-item .checkbox { border-color: var(--green); }
  body.kid-1 .chore-item.done .checkbox { background: var(--green); border-color: var(--green); color:white; }
  body.kid-1 .progress-bar-fill { background: linear-gradient(90deg, var(--green), #43A047); }
  body.kid-2 .chore-item .checkbox { border-color: var(--pink); }
  body.kid-2 .chore-item.done .checkbox { background: var(--pink); border-color: var(--pink); color:white; }
  body.kid-2 .progress-bar-fill { background: linear-gradient(90deg, var(--pink), #E91E8C); }
  body.kid-3 .chore-item .checkbox { border-color: var(--purple); }
  body.kid-3 .chore-item.done .checkbox { background: var(--purple); border-color: var(--purple); color:white; }
  body.kid-3 .progress-bar-fill { background: linear-gradient(90deg, var(--purple), #AB47BC); }
  body.kid-4 .chore-item .checkbox { border-color: var(--coral); }
  body.kid-4 .chore-item.done .checkbox { background: var(--coral); border-color: var(--coral); color:white; }
  body.kid-4 .progress-bar-fill { background: linear-gradient(90deg, var(--coral), #F4511E); }

  /* MOM VIEW */
  .mom-grid { display: flex; flex-direction: column; gap: 14px; }
  .mom-card {
    background: white; border-radius: 20px; padding: 16px 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
  }
  .mom-card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .mom-kid-name {
    font-family: 'Fredoka One', cursive; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;
  }
  .mom-pct {
    font-family: 'Fredoka One', cursive; font-size: 1.1rem;
  }
  .mom-items { display: flex; flex-direction: column; gap: 4px; }
  .mom-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.88rem; font-weight: 700; padding: 4px 0;
    border-bottom: 1px dashed #F0E8E0;
  }
  .mom-row:last-child { border-bottom: none; }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .dot.done { background: var(--green); color: white; }
  .dot.todo { background: #EEE; border: 2px solid #DDD; }
  .mom-row.done-row span { color: #aaa; text-decoration: line-through; }
  .mom-bar-bg {
    height: 8px; background: #F0E0D8; border-radius: 999px; overflow: hidden; margin-top: 6px;
  }
  .mom-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .refresh-btn {
    display: block; margin: 0 auto 16px;
    background: #37474F; color: white; border: none;
    border-radius: 999px; padding: 10px 24px;
    font-family: 'Fredoka One', cursive; font-size: 1rem;
    cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .kid-colors { --c0: #4FC3F7; --c1: #66BB6A; --c2: #F48FB1; --c3: #CE93D8; --c4: #FF8A65; }

  footer { text-align: center; color: #C9B0A0; font-size: 0.78rem; margin-top: 10px; font-weight: 700; }
</style>
</head>
<body class="kid-0 kid-colors">

<header>
  <h1>☀️ Summer Days</h1>
  <p>The Wellness Collective Kids Edition</p>
</header>
<div class="date-bar" id="datebar"></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
<footer>Made with ❤️ by Mom</footer>

<script>
// ============================================================
// EDIT KIDS HERE
// ============================================================
const KIDS = [
  { name: "Levi",      emoji: "🌊", age: 13 },
  { name: "Jaymo",     emoji: "🌿", age: 12 },
  { name: "Riley",     emoji: "🌸", age: 12 },
  { name: "Anna",      emoji: "⭐", age: 10 },
  { name: "Charlotte", emoji: "🦋", age: 9  },
];

const KID_COLORS = ["#4FC3F7","#66BB6A","#F48FB1","#CE93D8","#FF8A65"];

// ============================================================
// CHORE POOL — rotates across all 5 kids by day
// ============================================================
const CHORE_POOL = [
  { id: "dishes_wash",   label: "Wash the dishes",              emoji: "🍽️" },
  { id: "dishes_dry",    label: "Dry & put away dishes",        emoji: "🧺" },
  { id: "sweep",         label: "Sweep or vacuum",              emoji: "🧹" },
  { id: "bathroom_sink", label: "Clean bathroom sink & mirror", emoji: "🪥" },
  { id: "toilet",        label: "Clean the toilet",             emoji: "🚽" },
  { id: "laundry_fold",  label: "Fold a load of laundry",       emoji: "👕" },
  { id: "laundry_put",   label: "Put away laundry",             emoji: "🗂️" },
  { id: "counters",      label: "Wipe down kitchen counters",   emoji: "✨" },
  { id: "trash",         label: "Take out trash & recycling",   emoji: "🗑️" },
];

// ============================================================
// BIBLE VERSES
// ============================================================
const VERSES = [
  { text: "I can do all things through Christ who strengthens me.", ref: "Philippians 4:13" },
  { text: "For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you, plans to give you hope and a future.", ref: "Jeremiah 29:11" },
  { text: "Be strong and courageous. Do not be afraid; do not be discouraged, for the Lord your God will be with you wherever you go.", ref: "Joshua 1:9" },
  { text: "The Lord is my shepherd; I shall not want.", ref: "Psalm 23:1" },
  { text: "Trust in the Lord with all your heart and lean not on your own understanding.", ref: "Proverbs 3:5" },
  { text: "Love one another as I have loved you.", ref: "John 13:34" },
  { text: "Do not be anxious about anything, but in every situation present your requests to God.", ref: "Philippians 4:6" },
  { text: "Give thanks to the Lord, for He is good; His love endures forever.", ref: "Psalm 107:1" },
  { text: "She is clothed with strength and dignity; she can laugh at the days to come.", ref: "Proverbs 31:25" },
  { text: "Let all that you do be done in love.", ref: "1 Corinthians 16:14" },
  { text: "The joy of the Lord is your strength.", ref: "Nehemiah 8:10" },
  { text: "Even youths grow tired and weary, but those who hope in the Lord will renew their strength.", ref: "Isaiah 40:31" },
  { text: "Above all, clothe yourselves with love, which binds us all together in perfect harmony.", ref: "Colossians 3:14" },
  { text: "A cheerful heart is good medicine.", ref: "Proverbs 17:22" },
  { text: "Children are a heritage from the Lord, offspring a reward from him.", ref: "Psalm 127:3" },
  { text: "Be kind and compassionate to one another, forgiving each other, just as in Christ God forgave you.", ref: "Ephesians 4:32" },
  { text: "Let your light shine before others, that they may see your good deeds.", ref: "Matthew 5:16" },
  { text: "Do to others as you would have them do to you.", ref: "Luke 6:31" },
  { text: "Whatever you do, work at it with all your heart, as working for the Lord.", ref: "Colossians 3:23" },
  { text: "Start children off on the way they should go, and even when they are old they will not turn from it.", ref: "Proverbs 22:6" },
  { text: "This is the day the Lord has made; let us rejoice and be glad in it.", ref: "Psalm 118:24" },
];

// ============================================================
// ACTIVITIES
// ============================================================
const ACTIVITIES = [
  "🚴 Bike Ride — at least 20 minutes",
  "🚶 Walk outside — at least 20 minutes",
  "🏋️ Workout with Mom's routine",
  "🤸 Trampoline time — at least 20 minutes",
  "🚴 Bike Ride — explore a new route!",
  "🚶 Walk — invite a sibling along",
  "🤸 Trampoline + stretching combo",
  "🏋️ Bodyweight workout — pushups, squats, planks",
];

// ============================================================
// DAILY MUSTS
// ============================================================
const DAILY_MUSTS = [
  { id: "room",     label: "Tidy your room",               emoji: "🛏️" },
  { id: "reading",  label: "Read OR do art for 20+ min",   emoji: "📖" },
  { id: "activity", label: "Do your daily activity",       emoji: "⚡" },
];

// ============================================================
// LOGIC
// ============================================================
function getDayIndex() {
  const start = new Date("2026-06-01");
  const today = new Date();
  today.setHours(0,0,0,0); start.setHours(0,0,0,0);
  return Math.max(0, Math.floor((today - start) / 86400000));
}

function getChoreForKid(kidIdx) {
  const day = getDayIndex();
  return CHORE_POOL[(day * KIDS.length + kidIdx) % CHORE_POOL.length];
}

function getTodayVerse() {
  return VERSES[getDayIndex() % VERSES.length];
}

function getTodayActivity(kidIdx) {
  return ACTIVITIES[(getDayIndex() + kidIdx) % ACTIVITIES.length];
}

function stateKey(kidIdx) {
  return `summerdays_${new Date().toISOString().slice(0,10)}_kid${kidIdx}`;
}

function loadState(kidIdx) {
  try { return JSON.parse(localStorage.getItem(stateKey(kidIdx))) || {}; }
  catch { return {}; }
}

function saveState(kidIdx, state) {
  localStorage.setItem(stateKey(kidIdx), JSON.stringify(state));
}

function getKidProgress(kidIdx) {
  const state = loadState(kidIdx);
  const chore = getChoreForKid(kidIdx);
  const allIds = [...DAILY_MUSTS.map(m=>m.id), chore.id];
  const done = allIds.filter(id => !!state[id]).length;
  return { done, total: allIds.length, pct: Math.round((done/allIds.length)*100) };
}

// ============================================================
// RENDER — KID VIEW
// ============================================================
let activeView = 0; // 0-4 = kids, "mom" = mom view

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML =
    KIDS.map((kid, i) =>
      `<div class="tab${activeView===i?' active':''}" data-kid="${i}" onclick="selectView(${i})">${kid.emoji} ${kid.name}</div>`
    ).join("") +
    `<div class="tab${activeView==='mom'?' active':''}" data-kid="mom" onclick="selectView('mom')">👩 Mom</div>`;
}

function renderContent() {
  if (activeView === 'mom') { renderMomView(); return; }
  const i = activeView;
  const kid = KIDS[i];
  const verse = getTodayVerse();
  const activity = getTodayActivity(i);
  const chore = getChoreForKid(i);
  const state = loadState(i);
  document.body.className = `kid-${i}`;

  const musts = DAILY_MUSTS.map(m => {
    const done = !!state[m.id];
    return `<div class="must-item${done?' done':''}" onclick="toggleItem('${m.id}')">
      <div class="checkbox">${done?'✓':''}</div>
      <span class="must-label">${m.emoji} ${m.label}</span>
    </div>`;
  }).join("");

  const choreDone = !!state[chore.id];
  const { done, total, pct } = getKidProgress(i);
  const allDone = done === total;

  document.getElementById("content").innerHTML = `
    <div class="card verse-card">
      <div class="card-label" style="color:#2E7D32">🌿 Today's Verse</div>
      <div class="verse-text">"${verse.text}"</div>
      <div class="verse-ref">— ${verse.ref}</div>
    </div>
    <div class="card activity-card">
      <div class="card-label" style="color:#0288D1">⚡ Today's Activity</div>
      <div class="activity-box">${activity}</div>
    </div>
    <div class="card must-card">
      <div class="card-label" style="color:#E65100">✅ Daily Musts</div>
      ${musts}
    </div>
    <div class="card chore-card">
      <div class="card-label" style="color:#BF360C">🧹 Your Chore Today</div>
      <div class="chore-item${choreDone?' done':''}" onclick="toggleItem('${chore.id}')">
        <div class="checkbox" style="border-color:${KID_COLORS[i]};${choreDone?'background:'+KID_COLORS[i]+';color:white;':''}">${choreDone?'✓':''}</div>
        <span class="chore-label">${chore.emoji} ${chore.label}</span>
      </div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,#FFF8E1,#FFF3E0)">
      <div class="card-label" style="color:#F57F17">📊 ${kid.name}'s Progress</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${KID_COLORS[i]},${KID_COLORS[i]}aa)"></div>
      </div>
      <div class="progress-text">${done} of ${total} done — ${pct}%</div>
      ${allDone ? `<div style="text-align:center;padding:16px 0 4px;font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--green);animation:bounce 0.6s ease">🎉 Amazing job, ${kid.name}! 🎉</div>` : ''}
    </div>
  `;
}

// ============================================================
// RENDER — MOM VIEW
// ============================================================
function renderMomView() {
  document.body.className = '';
  const chores = KIDS.map((_,i) => getChoreForKid(i));

  const cards = KIDS.map((kid, i) => {
    const state = loadState(i);
    const chore = chores[i];
    const color = KID_COLORS[i];
    const { done, total, pct } = getKidProgress(i);

    const rows = [
      ...DAILY_MUSTS.map(m => {
        const isDone = !!state[m.id];
        return `<div class="mom-row${isDone?' done-row':''}">
          <div class="dot ${isDone?'done':'todo'}">${isDone?'✓':''}</div>
          <span>${m.emoji} ${m.label}</span>
        </div>`;
      }),
      (() => {
        const isDone = !!state[chore.id];
        return `<div class="mom-row${isDone?' done-row':''}">
          <div class="dot ${isDone?'done':'todo'}">${isDone?'✓':''}</div>
          <span>${chore.emoji} ${chore.label}</span>
        </div>`;
      })()
    ].join("");

    return `<div class="mom-card" style="border-left:5px solid ${color}">
      <div class="mom-card-header">
        <div class="mom-kid-name" style="color:${color}">${kid.emoji} ${kid.name}</div>
        <div class="mom-pct" style="color:${color}">${pct}%</div>
      </div>
      <div class="mom-items">${rows}</div>
      <div class="mom-bar-bg" style="margin-top:10px">
        <div class="mom-bar-fill" style="width:${pct}%;background:${color}"></div>
      </div>
    </div>`;
  }).join("");

  const allTotal = KIDS.length * 4;
  const allDone = KIDS.reduce((sum, _, i) => sum + getKidProgress(i).done, 0);
  const overallPct = Math.round((allDone / allTotal) * 100);

  document.getElementById("content").innerHTML = `
    <button class="refresh-btn" onclick="renderMomView()">🔄 Refresh</button>
    <div class="card" style="background:linear-gradient(135deg,#37474F,#263238);color:white;text-align:center">
      <div style="font-family:'Fredoka One',cursive;font-size:1.1rem;opacity:0.8;margin-bottom:6px">Overall Family Progress</div>
      <div style="font-family:'Fredoka One',cursive;font-size:2.5rem">${overallPct}%</div>
      <div style="font-size:0.85rem;opacity:0.7;margin-top:4px">${allDone} of ${allTotal} tasks complete today</div>
      <div class="mom-bar-bg" style="margin-top:12px;background:rgba(255,255,255,0.15)">
        <div class="mom-bar-fill" style="width:${overallPct}%;background:linear-gradient(90deg,var(--sun),var(--coral))"></div>
      </div>
    </div>
    <div class="mom-grid">${cards}</div>
  `;
}

// ============================================================
// INTERACTION
// ============================================================
function toggleItem(itemId) {
  const state = loadState(activeView);
  state[itemId] = !state[itemId];
  saveState(activeView, state);
  renderContent();
}

function selectView(v) {
  activeView = v;
  renderTabs();
  renderContent();
}

function setDateBar() {
  const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById("datebar").textContent = new Date().toLocaleDateString('en-US', opts);
}

setDateBar();
renderTabs();
renderContent();
</script>
</body>
</html>
